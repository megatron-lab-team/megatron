name: "Semgrep SAST"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  semgrep-scan:
    name: Scan code
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep and output SARIF
        run: |
          pip install semgrep
          semgrep scan --config "p/security-audit" --config "p/django" --config "p/owasp-top-ten" --sarif -o semgrep-findings.sarif

      - name: Upload SARIF report to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-findings.sarif
        if: always()
