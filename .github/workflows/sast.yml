name: "Semgrep SAST"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  semgrep-scan:
    name: Scan code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan \
            --config "p/default" \
            --config "p/security-audit" \
            --config "p/django" \
            --config "p/owasp-top-ten" \
            --no-git-ignore \
            --sarif -o semgrep-findings.sarif \
            . || true
          semgrep scan \
            --config "p/default" \
            --config "p/security-audit" \
            --config "p/django" \
            --config "p/owasp-top-ten" \
            --no-git-ignore \
            . || true

      - name: Upload Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep-findings.sarif

  build-and-push:
    name: Build Docker Image & Generate SBOM
    needs: semgrep-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/megatron-app:latest
            ghcr.io/${{ github.repository_owner }}/megatron-app:${{ github.sha }}

      - name: Generate SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json
