name: "Semgrep SAST"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  semgrep-scan:
    name: Scan code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan \
            --config "p/default" \
            --config "p/security-audit" \
            --config "p/django" \
            --config "p/owasp-top-ten" \
            --no-git-ignore \
            --sarif -o semgrep-findings.sarif \
            . || true
          semgrep scan \
            --config "p/default" \
            --config "p/security-audit" \
            --config "p/django" \
            --config "p/owasp-top-ten" \
            --no-git-ignore \
            . || true

      - name: Upload Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep-findings.sarif
